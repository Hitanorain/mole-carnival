<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>地鼠嘉年华</title>
<meta name="description" content="地鼠嘉年华 Mole Carnival：不只是打地鼠——头盔地鼠、小偷地鼠、冰冻和闪电地鼠、会扔泥巴的地鼠大王，连击开启超级锤子，还能面对面双人对战。">
<meta name="theme-color" content="#6cc24a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236cc24a'/%3E%3Cellipse cx='32' cy='52' rx='24' ry='8' fill='%232e1b10'/%3E%3Cpath d='M14 54V30a18 17 0 0 1 36 0v24z' fill='%23c98f5e'/%3E%3Ccircle cx='25' cy='28' r='3.2' fill='%23222'/%3E%3Ccircle cx='39' cy='28' r='3.2' fill='%23222'/%3E%3Cellipse cx='32' cy='35' rx='4' ry='3' fill='%23ff7fa6'/%3E%3Crect x='29' y='38' width='6' height='5' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4a3218; --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc95a; }
  body { font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  button { font-family: inherit; cursor: pointer; border: none; color: inherit; background: none; padding: 0; }
  #cv { position: fixed; inset: 0; z-index: 0; touch-action: none; cursor: none; }
  .screen { position: fixed; inset: 0; z-index: 2; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s, visibility 0s .3s;
    display: flex; align-items: center; justify-content: center; padding: calc(var(--st) + 12px) 16px calc(var(--sb) + 12px); }
  .screen.on { opacity: 1; visibility: visible; transition: opacity .3s; }
  .screen.dim { background: rgba(40, 28, 10, .45); }
  .ui { pointer-events: auto; }

  /* 糖果按钮 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 30px; min-width: 200px; border-radius: 999px;
    font-size: 25px; color: #fff; letter-spacing: .06em; text-shadow: 0 2px 0 rgba(150, 50, 0, .25);
    background: linear-gradient(180deg, #ffe17a 0%, #ffb53c 55%, #ff9a2e 100%);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 7px 0 #d8701c, 0 12px 24px rgba(80, 40, 10, .25);
    transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(5px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 2px 0 #d8701c; }
  .btn.pink { background: linear-gradient(180deg, #ff9cc0 0%, #ff6a9c 55%, #ff4f8b 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 7px 0 #c63a6d, 0 12px 24px rgba(120,20,60,.25); }
  .btn.pink:active { box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #c63a6d; }
  .btn.mint { background: linear-gradient(180deg, #8ff0c8 0%, #3fd0a0 55%, #22b989 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 7px 0 #158a64, 0 12px 24px rgba(10,80,60,.25); }
  .btn.mint:active { box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #158a64; }
  .btn.sky { background: linear-gradient(180deg, #9fdcff 0%, #4fb2f5 55%, #3496e6 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 7px 0 #1f6fb8, 0 12px 24px rgba(10,50,110,.25); }
  .btn.sky:active { box-shadow: inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #1f6fb8; }
  .btn.small { font-size: 20px; padding: 9px 22px; min-width: 130px; }
  .btn small { font-size: 14px; opacity: .9; letter-spacing: 0; }
  .rbtn { width: 50px; height: 50px; border-radius: 50%; font-size: 23px; display: inline-flex; align-items: center; justify-content: center; flex: none;
    background: rgba(255, 255, 255, .9); box-shadow: 0 5px 0 rgba(90, 140, 50, .45), 0 8px 18px rgba(40, 60, 20, .18); transition: transform .08s, box-shadow .08s; }
  .rbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(90, 140, 50, .45); }
  .rbtn svg { width: 26px; height: 26px; fill: none; stroke: #4a3218; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .rbtn.off { opacity: .45; }

  .card { background: rgba(255, 252, 240, .94); border-radius: 30px; padding: 22px 24px; box-shadow: 0 10px 0 rgba(120, 80, 30, .25), 0 20px 50px rgba(40, 30, 10, .3);
    text-align: center; max-width: 520px; width: 100%; max-height: 100%; overflow: auto; }
  .card h2 { margin: 0 0 8px; font-size: 32px; font-weight: normal; }
  .card p { margin: 6px 0; font-size: 18px; line-height: 1.5; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  /* 首页 */
  #title { flex-direction: column; }
  #home { position: fixed; left: 14px; top: calc(var(--st) + 12px); }
  .tog { position: fixed; right: 14px; top: calc(var(--st) + 12px); display: flex; gap: 10px; }
  .tcol { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo h1 { margin: 0; font-weight: normal; font-size: clamp(46px, 11vw, 84px); line-height: 1.05; letter-spacing: .04em; white-space: nowrap; }
  .logo h1 span { display: inline-block; color: var(--c); text-shadow: 0 4px 0 var(--d), 0 6px 0 var(--d), 0 12px 18px rgba(40, 30, 10, .35);
    -webkit-text-stroke: 2px #fff; paint-order: stroke fill; animation: hop 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .14s); }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) } 30% { transform: translateY(-12px) rotate(-4deg) } }
  .logo .en { text-align: center; font-size: 20px; letter-spacing: .5em; color: #fff; text-shadow: 0 2px 0 rgba(60, 90, 20, .5); margin-top: 4px; padding-left: .5em; }
  .menu { display: flex; flex-direction: column; align-items: center; gap: 16px; background: rgba(255, 252, 240, .82); padding: 22px 26px 20px; border-radius: 32px;
    box-shadow: 0 8px 0 rgba(90, 130, 40, .35), 0 18px 40px rgba(30, 50, 10, .25); }
  .menu .btn { width: 260px; }
  .menu .sub { display: flex; gap: 12px; }
  .menu .sub .btn { width: auto; min-width: 124px; }
  .best { font-size: 16px; opacity: .8; min-height: 1em; }

  /* 选关 */
  .wtabs { display: flex; gap: 8px; justify-content: center; margin: 4px 0 14px; flex-wrap: wrap; }
  .wtabs button { padding: 8px 14px; border-radius: 999px; font-size: 18px; background: rgba(120, 90, 40, .12); }
  .wtabs button.on { background: #ffb53c; color: #fff; box-shadow: 0 4px 0 #d8701c; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .lv { aspect-ratio: 1; border-radius: 22px; font-size: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: linear-gradient(180deg, #a8e46e, #6cc24a); color: #fff; text-shadow: 0 2px 0 rgba(40, 90, 10, .4); box-shadow: 0 5px 0 #3f8f2c; }
  .lv:active { transform: translateY(4px); box-shadow: 0 1px 0 #3f8f2c; }
  .lv.boss { background: linear-gradient(180deg, #ffb07a, #ff7a45); box-shadow: 0 5px 0 #c4501f; }
  .lv.lock { background: #cfc6b4; box-shadow: 0 5px 0 #a39a88; color: #fff; }
  .lv .st { font-size: 12px; letter-spacing: 1px; color: #ffe14a; text-shadow: 0 1px 0 rgba(0,0,0,.25); min-height: 14px; }
  .lv .st i { font-style: normal; color: rgba(255,255,255,.45); }

  /* 关卡介绍 */
  .newmole { display: flex; align-items: center; gap: 14px; text-align: left; background: rgba(255, 220, 140, .35); border-radius: 20px; padding: 10px 14px; margin: 12px 0 4px; }
  .newmole canvas { width: 96px; height: 96px; flex: none; }
  .newmole b { font-weight: normal; font-size: 21px; display: block; color: #d0601c; }
  .goal { font-size: 22px; margin: 8px 0; }
  .stars3 { font-size: 15px; opacity: .85; }

  /* 结果 */
  .bigstars { font-size: 58px; letter-spacing: 6px; margin: 4px 0; }
  .bigstars span { display: inline-block; color: #d9cfbd; transform: scale(.4); transition: transform .35s cubic-bezier(.3, 1.8, .5, 1), color .2s; }
  .bigstars span.on { color: #ffc31a; transform: scale(1); text-shadow: 0 3px 0 #d68a00; }
  .score { font-size: 46px; color: #e2621c; }
  .stats { font-size: 16px; opacity: .8; }
  .newrec { color: #ff4f8b; font-size: 22px; animation: hop 1.2s infinite; }

  /* 图鉴 */
  .guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; text-align: left; margin-top: 10px; }
  .guide div { display: flex; gap: 10px; align-items: center; background: rgba(120, 90, 40, .08); border-radius: 16px; padding: 6px 10px 6px 4px; font-size: 14px; line-height: 1.35; }
  .guide canvas { width: 64px; height: 64px; flex: none; }
  .guide b { font-weight: normal; font-size: 17px; display: block; }
  #help .card { max-width: 760px; }
  .tips { text-align: left; font-size: 16px; line-height: 1.6; margin: 6px 0 0; padding-left: 1.2em; }

  #pauseBtn { position: fixed; z-index: 3; left: 12px; top: calc(var(--st) + 12px); display: none; }
  body.playing #pauseBtn { display: inline-flex; }
  #safe { position: fixed; bottom: 0; left: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); pointer-events: none; visibility: hidden; }
  .ver { position: fixed; right: 12px; bottom: calc(var(--sb) + 6px); font-size: 12px; color: rgba(255, 255, 255, .7); }
  @media (max-height: 620px) { .menu { gap: 10px; padding: 14px 20px; } .tcol { gap: 8px; } .btn { padding: 9px 24px; font-size: 21px; } .logo h1 { font-size: 44px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>
<button class="rbtn ui" id="pauseBtn" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>

<section id="title" class="screen on">
  <a class="rbtn ui" id="home" href="https://hitanorain.github.io/" aria-label="回到游戏厅" title="回到游戏厅"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a>
  <div class="tog ui">
    <button class="rbtn" data-tog="music" aria-label="背景音乐" title="背景音乐">🎵</button>
    <button class="rbtn" data-tog="sfx" aria-label="音效" title="音效">🔔</button>
  </div>
  <div class="tcol">
    <div class="logo" aria-label="地鼠嘉年华">
      <h1><span style="--i:0;--c:#c98f5e;--d:#7a4a22">地</span><span style="--i:1;--c:#ffb02e;--d:#c27400">鼠</span><span style="--i:2;--c:#ff6fa5;--d:#c23f7a">嘉</span><span style="--i:3;--c:#4cc4ff;--d:#1f86c9">年</span><span style="--i:4;--c:#b47cff;--d:#7a45d0">华</span></h1>
      <div class="en">MOLE CARNIVAL</div>
    </div>
    <div class="menu ui">
      <button class="btn pink" id="bLevels">闯关模式</button>
      <button class="btn" id="bTimed">60 秒挑战</button>
      <button class="btn sky" id="bVs">双人对战 <small>面对面</small></button>
      <div class="sub"><button class="btn mint small" id="bHelp">地鼠图鉴</button></div>
      <div class="best" id="bestLbl"></div>
    </div>
  </div>
  <div class="ver" id="ver"></div>
</section>

<section id="levels" class="screen dim">
  <div class="card ui">
    <h2>选择关卡</h2>
    <div class="wtabs" id="wtabs"></div>
    <div class="lvgrid" id="lvgrid"></div>
    <div class="row"><button class="btn mint small" id="lvBack">返回</button></div>
  </div>
</section>

<section id="intro" class="screen dim">
  <div class="card ui">
    <h2 id="inTitle"></h2>
    <div class="goal" id="inGoal"></div>
    <div class="stars3" id="inStars"></div>
    <div id="inNew"></div>
    <div class="row"><button class="btn mint small" id="inBack">返回</button><button class="btn pink" id="inGo">开始！</button></div>
  </div>
</section>

<section id="pause" class="screen dim">
  <div class="card ui">
    <h2>暂停一下</h2>
    <div class="row">
      <button class="rbtn" data-tog="music" aria-label="背景音乐" title="背景音乐">🎵</button>
      <button class="rbtn" data-tog="sfx" aria-label="音效" title="音效">🔔</button>
    </div>
    <div class="row" style="flex-direction:column;align-items:center">
      <button class="btn pink" id="psGo">继续</button>
      <button class="btn" id="psRetry">重来</button>
      <button class="btn mint small" id="psHome">回首页</button>
    </div>
  </div>
</section>

<section id="result" class="screen dim">
  <div class="card ui">
    <h2 id="rsTitle"></h2>
    <div class="bigstars" id="rsStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="score" id="rsScore"></div>
    <div id="rsNote"></div>
    <div class="stats" id="rsStats"></div>
    <div class="row">
      <button class="btn mint small" id="rsHome">首页</button>
      <button class="btn small" id="rsRetry">重来</button>
      <button class="btn pink small" id="rsNext">下一关</button>
    </div>
  </div>
</section>

<section id="help" class="screen dim">
  <div class="card ui">
    <h2>地鼠图鉴</h2>
    <ul class="tips">
      <li>点（或用鼠标点）冒出来的坏地鼠，<b style="font-weight:normal;color:#e2621c">别打小兔子和炸弹</b>。</li>
      <li>地鼠刚冒头就打中，有「神速」加分；让地鼠溜走会断连击。</li>
      <li>连击满 10 下进入<b style="font-weight:normal;color:#e2621c">超级锤子</b>：分数翻倍，还能按住划过去连着打！</li>
      <li>双人对战：平板平放在桌上，两人面对面各守一半。打中礼物地鼠，给对手送去一波炸弹和小兔子；进入超级锤子时对手屏幕会被糊上泥巴。</li>
    </ul>
    <div class="guide" id="guide"></div>
    <div class="row"><button class="btn pink small" id="hpBack">知道了</button></div>
  </div>
</section>

<script>
'use strict';
const VERSION = 'v1.0';
const $ = s => document.querySelector(s);
const SAVE_KEY = 'mole-carnival-v1';
const save = { stars: {}, best60: 0, music: true, sfx: true, seenHelp: false, world: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
function wpick(mix) { let s = 0; for (const k in mix) s += mix[k]; let r = Math.random() * s; for (const k in mix) { r -= mix[k]; if (r <= 0) return k; } return 'normal'; }
const FONT = '"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif';
const TAU = Math.PI * 2;

// ---------- 世界和地鼠 ----------
const THEMES = {
  garden: { name: '春日花园', icon: '🌼', g1: '#b3ea78', g2: '#62bb45', stripe: 'rgba(255,255,255,.07)', mound: '#9a6a40', moundTop: '#c08b56', hole: '#2e1b10', decor: 'flower' },
  beach:  { name: '夏日沙滩', icon: '🍉', g1: '#fff0c4', g2: '#f3c46c', stripe: 'rgba(255,255,255,.12)', mound: '#d39a55', moundTop: '#ebbd7c', hole: '#4a2c14', decor: 'shell' },
  snow:   { name: '冬日雪原', icon: '⛄', g1: '#f7fcff', g2: '#bcdaf0', stripe: 'rgba(255,255,255,.25)', mound: '#94b9d6', moundTop: '#d8ebf8', hole: '#26364d', decor: 'snow' },
};
const WORLDS = ['garden', 'beach', 'snow'];

const TYPES = {
  normal:  { name: '小地鼠', pts: 10, stay: 1, tip: '一下就晕，打它！' },
  gold:    { name: '金地鼠', pts: 50, stay: .62, tip: '一闪就跑，打中得 50 分！' },
  bunny:   { name: '小兔子', friend: true, stay: 1.15, tip: '好朋友！千万别打，打了扣 30 分、断连击。' },
  helmet:  { name: '头盔地鼠', pts: 20, hp: 2, stay: 1.3, tip: '要打两下：先把头盔敲飞。' },
  bomb:    { name: '炸弹', bad: true, stay: 1.3, tip: '别碰！打到会被炸晕 1 秒，还会断连击。' },
  ice:     { name: '冰冰地鼠', pts: 15, stay: 1, tip: '打中后所有地鼠被冻住 3 秒，跑不掉了！' },
  thunder: { name: '闪电地鼠', pts: 15, stay: 1, tip: '打中后闪电一口气劈晕场上所有坏地鼠。' },
  thief:   { name: '小偷地鼠', pts: 15, hops: 2, stay: 1, tip: '打一下掉金币、换个洞逃跑，连抓 3 次才抓住（+60）。' },
  clock:   { name: '闹钟地鼠', pts: 10, stay: .9, tip: '打中加 5 秒时间。' },
  gift:    { name: '礼物地鼠', pts: 10, stay: .9, tip: '双人对战才有：打中给对手送一波捣蛋！' },
  boss:    { name: '地鼠大王', pts: 20, stay: 1.7, tip: '每个世界第 10 关。打 3 下它就钻走换洞，还会扔泥巴糊住屏幕——点泥巴能擦掉。' },
};
const ENEMY = t => !TYPES[t].friend && !TYPES[t].bad;
// 第一个世界每关介绍一种新地鼠
const UNLOCK = ['normal', 'gold', 'bunny', 'helmet', 'bomb', 'ice', 'thunder', 'thief', 'clock'];
const BASEW = { normal: 10, gold: 1.1, bunny: 1.7, helmet: 2.3, bomb: 1.5, ice: .55, thunder: .55, thief: .8, clock: .6, gift: .9 };
const VALUE = { normal: 10, gold: 30, bunny: 0, helmet: 25, bomb: 0, ice: 30, thunder: 40, thief: 60, clock: 10, gift: 10 };

function mixFor(w, n) {
  const k = w > 0 ? UNLOCK.length : Math.min(UNLOCK.length, n), mix = {};
  for (let i = 0; i < k; i++) { const t = UNLOCK[i]; mix[t] = BASEW[t] * ((t === 'bunny' || t === 'bomb') ? 1 + w * .35 : 1); }
  if (w === 0 && n > 1 && n <= UNLOCK.length) mix[UNLOCK[n - 1]] *= 2.6; // 新朋友多出来几次
  return mix;
}
function objFor(w, n) {
  const o = [null, null, { k: 'nofriend', label: '一只小兔子都不打' }, null, { k: 'combo', v: 8 + w * 4, label: `连击达到 ${8 + w * 4}` },
    { k: 'gold', v: 2 + w, label: `打中 ${2 + w} 只金地鼠` }, { k: 'nofriend', label: '一只小兔子都不打' }, { k: 'combo', v: 12 + w * 4, label: `连击达到 ${12 + w * 4}` },
    { k: 'thief', v: 1 + w, label: `抓住 ${1 + w} 个小偷` }, { k: 'nobomb', label: '一个炸弹都不碰' }];
  return w === 0 ? (n >= 3 ? o[n - 1] : null) : o[n - 1];
}
function expPts(mix) { let s = 0, v = 0; for (const k in mix) { s += mix[k]; v += mix[k] * VALUE[k]; } return v / s; }

function levelDef(L) {
  const w = Math.floor((L - 1) / 10), n = (L - 1) % 10 + 1, theme = WORLDS[w];
  const grid = [[3, 3], [3, 4], [4, 4]][w];
  if (n === 10) {
    return { mode: 'level', L, w, n, theme, grid, boss: true, bossHp: [12, 16, 20][w], dur: 45,
      mix: (() => { const m = mixFor(w, 9); delete m.clock; return m; })(), stay: 1.35 - w * .1, interval: 1.35 - w * .12, maxUp: 2 + w, obj: null };
  }
  const f = 1 + w * .2 + (n - 1) * .035;
  const mix = mixFor(w, n), dur = 40;
  const interval = .95 / f, stay = 1.32 / f, maxUp = Math.min(grid[0] * grid[1] - 3, 2 + w + Math.floor(n / 4));
  const spawns = dur / interval;
  const t1 = Math.round(spawns * (expPts(mix) + 4) * .42 * (1 + w * .15) / 10) * 10;

function layoutBoard(b, x, y, w, h, rot) {

// ---------- 特效 ----------
function fx(b, o) { b.fx.push(Object.assign({ t: 0, life: .6, vx: 0, vy: 0, g: 0, rot: 0, vr: 0, size: 8, color: '#fff' }, o)); }
function burst(b, x, y, n, kind, colors, sp = 260, size = 8) {

}

// ---------- 规则 ----------
function curF(b) { return b.def.ramp ? 1 + b.def.ramp * clamp(b.elapsed / b.def.dur, 0, 1) : 1; }
function newMole(b, type) {
  const T = TYPES[type], f = curF(b);
  const stay = type === 'boss' ? T.stay - b.def.w * .3 : T.stay * b.def.stay / f;
  return { type, st: 'rise', t: 0, rise: 0, stay, hp: T.hp || 1, hops: T.hops || 0, upT: 0, seed: Math.random(), squash: 0, flash: 0 };
}
function spawn(b) {
  const empty = b.holes.filter(h => !h.m && h.cool <= 0);
  if (!empty.length) return;
  const h = pick(empty);
  let type = b.queue.length ? b.queue.shift() : wpick(b.def.mix);
  if (type === 'clock' && b.def.mode === 'demo') type = 'normal';
  h.m = newMole(b, type);

}

function breakCombo(b, why) {

  b.combo = 0;
}
function addHit(b, h, m, base, how) {
  b.combo++; b.maxCombo = Math.max(b.maxCombo, b.combo); b.stats.hits++;
  const fast = how === 'tap' && m.upT < .38 && m.type !== 'boss';
  const mult = b.fever > 0 ? 2 : 1;
  const pts = (base + (fast ? 5 : 0) + Math.min(10, Math.floor(b.combo / 5) * 2)) * mult;
  if (b.def.mode !== 'demo') b.score += pts;
  const { r, base: by } = moleBase(h, m);
  floatText(b, h.x, by - r * 2.3, '+' + pts, mult > 1 ? '#ffe14a' : '#fff', fast ? 30 : 26);
  if (fast) floatText(b, h.x, by - r * 3, '神速!', '#7af0ff', 20);
  Snd.bonk(b.combo);
  if (b.def.mode === 'demo') return;
  if (b.combo % 10 === 0) {
    if (b.fever > 0) { b.fever += 3; shout(b, `${b.combo} 连击！`, '#ffe14a'); }
    else enterFever(b);
  } else if (b.combo % 5 === 0) shout(b, `${b.combo} 连击！`, '#fff');
}
function enterFever(b) {

  burst(b, b.rect.w / 2, b.rect.h / 2, 30, 'star', ['#ffe14a', '#ff9cc0', '#8ff0c8', '#9fdcff'], 520, 12);
  if (b.opp) { for (let k = 0; k < 2; k++) addMud(b.opp); shout(b.opp, '被糊泥巴了！', '#c98f5e'); }
}

    r: Math.min(field.w, field.h) * rand(.16, .22), life: 4.5, max: 4.5, seed: Math.random() * 100, t: 0 });

    b.stats.friend++; breakCombo(b); shout(b, '别打小兔子！', '#ffb8d0'); Snd.cry(); b.shake = .25;

  if (d.mode === 'level' && !b.boss) { // 星星进度
    const pw = sw - ph * .7, k = clamp(b.score / d.targets[2], 0, 1);
    c.fillStyle = 'rgba(0,0,0,.1)'; rrect(c, L + ph * .35, py + ph - 7, pw, 4, 2); c.fill();
    c.fillStyle = '#ffb02e'; rrect(c, L + ph * .35, py + ph - 7, pw * k, 4, 2); c.fill();
    for (const t of d.targets) { c.fillStyle = b.score >= t ? '#ffb02e' : '#cbbfa8'; starPath(c, L + ph * .35 + pw * t / d.targets[2], py + ph - 5, 6, 2.6); c.fill(); }
  }
  // 时间
  const tx = L + sw + (avail - sw - tw - cw2) / 2, low = b.time < 10;
  pill(c, tx, py, tw, ph, low ? `rgba(255,${120 + 60 * Math.sin(now * 10)},120,.95)` : 'rgba(255,252,240,.92)');
  txt(c, '⏱ ' + Math.max(0, Math.ceil(b.time)), tx + tw / 2, py + ph / 2, fs * (low ? 1.1 : 1), '#4a3218');
  // 连击 / 超级锤子
  const cx = R - cw2;
  pill(c, cx, py, cw2, ph, b.fever > 0 ? `hsl(${(now * 200) % 360},90%,72%)` : 'rgba(255,252,240,.92)');
  if (b.fever > 0) {
    txt(c, `超级 ×2  ${b.combo}`, cx + cw2 / 2, py + ph * .45, fs * .9, '#4a3218');
    c.fillStyle = 'rgba(255,255,255,.8)'; rrect(c, cx + ph * .4, py + ph - 8, (cw2 - ph * .8) * clamp(b.fever / 6.5, 0, 1), 4, 2); c.fill();
  } else {
    txt(c, `连击 ${b.combo}`, cx + cw2 / 2, py + ph * .45, fs * .9, '#4a3218');
    c.fillStyle = 'rgba(0,0,0,.1)'; rrect(c, cx + ph * .4, py + ph - 8, cw2 - ph * .8, 4, 2); c.fill();
    c.fillStyle = '#ff6a9c'; rrect(c, cx + ph * .4, py + ph - 8, (cw2 - ph * .8) * (b.combo % 10) / 10, 4, 2); c.fill();
  }
  if (b.stun > 0) txt(c, '晕乎乎…', w / 2, hh + 26, fs, '#fff', { stroke: 'rgba(0,0,0,.5)' });
}

// 锤子
const PTRS = new Map();
function drawHammer(p, now) {
  const b = boardAt(p.x, p.y);
  const fever = b && b.fever > 0, stun = b && b.stun > 0;
  const L = clamp(Math.min(W, H) * .15, 66, 130);
  let a;
  if (p.sw < .05) a = .7 * (1 - p.sw / .05); else if (p.sw < .12) a = 0; else a = .7 * Math.min(1, (p.sw - .12) / .15);
  let alpha = 1;
  if (p.touch && !p.down) alpha = clamp(1 - (p.sw - .3) / .25, 0, 1);
  if (alpha <= 0) return;
  const c = ctx;
  c.save(); c.globalAlpha = alpha;
  c.translate(p.x, p.y);
  if (b && b.rot) c.rotate(Math.PI);
  if (stun) c.rotate(Math.sin(now * 20) * .15);
  // 以手柄末端为轴转
  const px = L * 1.05, py = L * .25;
  c.translate(px, py); c.rotate(a); c.translate(-px, -py);
  const hx = 0, hy = -L * .3, hl = L * .8, ht = L * .5, ang = Math.atan2(hy - py, hx - px);
  // 手柄
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = L * .15; c.lineCap = 'round';
  c.beginPath(); c.moveTo(px, py + 3); c.lineTo(hx, hy + 3); c.stroke();
  c.strokeStyle = stun ? '#aaa' : '#ffd84a'; c.lineWidth = L * .12;
  c.beginPath(); c.moveTo(px, py); c.lineTo(hx, hy); c.stroke();
  // 锤头（竖着，下面那面砸）
  c.save(); c.translate(hx, hy); c.rotate(ang);
  const g = c.createLinearGradient(-ht / 2, 0, ht / 2, 0);
  if (fever) { g.addColorStop(0, '#fff7b0'); g.addColorStop(.5, '#ffd24a'); g.addColorStop(1, '#e09a00'); }
  else if (stun) { g.addColorStop(0, '#ccc'); g.addColorStop(1, '#888'); }
  else { g.addColorStop(0, '#ff8a8a'); g.addColorStop(.5, '#ff4b4b'); g.addColorStop(1, '#c82a2a'); }
  c.fillStyle = g; c.strokeStyle = 'rgba(80,20,10,.5)'; c.lineWidth = 2;
  rrect(c, -ht / 2, -hl / 2, ht, hl, ht * .3); c.fill(); c.stroke();
  c.fillStyle = fever ? '#fff' : '#ffe14a';
  c.fillRect(-ht / 2, -hl * .32, ht, hl * .1); c.fillRect(-ht / 2, hl * .22, ht, hl * .1);
  c.fillStyle = 'rgba(255,255,255,.35)'; rrect(c, -ht * .32, -hl * .42, ht * .18, hl * .84, ht * .09); c.fill();
  c.restore();
  if (fever) { c.fillStyle = '#fff7b0'; for (let i = 0; i < 3; i++) { const an = now * 5 + i * 2.1; starPath(c, hx + Math.cos(an) * L * .5, hy + Math.sin(an) * L * .5, 7, 3, an); c.fill(); } }
  c.restore();
  if (stun) { c.save(); c.fillStyle = '#ffe14a'; for (let i = 0; i < 3; i++) { const an = now * 6 + i * TAU / 3; starPath(c, p.x + Math.cos(an) * 26, p.y - 30 + Math.sin(an) * 8, 7, 3, an); c.fill(); } c.restore(); }
}

function frame(now) {
  for (const b of G.boards) drawBoard(b, now);
  if (G.mode === 'vs' && G.boards.length === 2) { // 中间的分隔线
    const b1 = G.boards[1]; ctx.fillStyle = '#fff8e0';
    if (b1.rot) ctx.fillRect(0, b1.rect.h - 2, W, 4); else ctx.fillRect(b1.rect.x - 2, 0, 4, H);
  }
  for (const p of PTRS.values()) if (p.vis) drawHammer(p, now);
}

let last = performance.now();
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  step(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  frame(G.t);
  requestAnimationFrame(loop);
}

// ---------- 输入 ----------
function ptr(e) {
  let p = PTRS.get(e.pointerId);
  if (!p) { p = { x: e.clientX, y: e.clientY, sw: 9, down: false, vis: false, touch: e.pointerType !== 'mouse', hitAt: new Map() }; PTRS.set(e.pointerId, p); }
  return p;
}
cv.addEventListener('pointerdown', e => {
  Snd.unlock(); e.preventDefault();
  const p = ptr(e); p.x = e.clientX; p.y = e.clientY; p.down = true; p.sw = 0; p.vis = true; p.touch = e.pointerType !== 'mouse';
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  whack(p.x, p.y, false);
});
window.addEventListener('pointermove', e => {
  const p = PTRS.get(e.pointerId) || (e.pointerType === 'mouse' ? ptr(e) : null); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (e.pointerType === 'mouse') p.vis = e.target === cv;
  if (p.down) { // 超级锤子：按住划过去也能打
    const b = boardAt(p.x, p.y);
    if (b && b.fever > 0 && canPlay()) {
      const [lx, ly] = toLocal(b, p.x, p.y), h = pickHole(b, lx, ly);
      if (h && whack(p.x, p.y, true)) p.sw = 0;
    }
  }
});
function up(e) { const p = PTRS.get(e.pointerId); if (!p) return; p.down = false; if (p.touch) setTimeout(() => { if (!p.down) PTRS.delete(e.pointerId); }, 600); }
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', up);
document.addEventListener('pointerdown', () => Snd.unlock(), { capture: true });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('mouseleave', () => { for (const p of PTRS.values()) if (!p.touch) p.vis = false; });

// ---------- 界面 ----------
const SCREENS = ['title', 'levels', 'intro', 'pause', 'result', 'help'];
function show(id) { SCREENS.forEach(s => $('#' + s).classList.toggle('on', s === id)); }
function setPlaying(v) { document.body.classList.toggle('playing', v); }

function goTitle() {
  G.mode = 'demo'; G.running = false; G.paused = false; G.count = 0; G.ending = 0;
  G.boards = [makeBoard(demoDef(), 0)]; layoutAll();
  setPlaying(false); show('title'); Snd.duck(true); Snd.music(true); Snd.setFever(false); Snd.setBpm(116);
  $('#bestLbl').textContent = [save.best60 ? `60 秒最高 ${save.best60}` : '', `闯关 ⭐ ${totalStars()}/90`].filter(Boolean).join(' · ');
}
function totalStars() { let s = 0; for (const k in save.stars) s += save.stars[k]; return s; }
function unlocked(L) { return L === 1 || (save.stars[L - 1] || 0) > 0; }

function renderLevels() {
  const w = save.world || 0;
  $('#wtabs').innerHTML = WORLDS.map((id, i) => {
    let s = 0; for (let L = i * 10 + 1; L <= i * 10 + 10; L++) s += save.stars[L] || 0;
    return `<button data-w="${i}" class="${i === w ? 'on' : ''}">${THEMES[id].icon} ${THEMES[id].name} <small>${s}/30</small></button>`;
  }).join('');
  let html = '';
  for (let n = 1; n <= 10; n++) {
    const L = w * 10 + n, st = save.stars[L] || 0, ok = unlocked(L);
    html += `<button class="lv ${n === 10 ? 'boss' : ''} ${ok ? '' : 'lock'}" data-l="${L}" ${ok ? '' : 'disabled'}>${ok ? (n === 10 ? '👑' : L) : '🔒'}<span class="st">${ok ? '★'.repeat(st) + '<i>' + '★'.repeat(3 - st) + '</i>' : ''}</span></button>`;
  }
  $('#lvgrid').innerHTML = html;
}
$('#wtabs').addEventListener('click', e => { const t = e.target.closest('[data-w]'); if (!t) return; save.world = +t.dataset.w; persist(); renderLevels(); });
$('#lvgrid').addEventListener('click', e => { const t = e.target.closest('[data-l]'); if (!t || t.disabled) return; showIntro(+t.dataset.l); });

function showIntro(L) {
  const d = levelDef(L); G.L = L;
  $('#inTitle').textContent = `${THEMES[d.theme].icon} 第 ${L} 关${d.boss ? ' · 大王关' : ''}`;
  if (d.boss) {
    $('#inGoal').textContent = `${d.dur} 秒内打败地鼠大王（${d.bossHp} 下）`;
    $('#inStars').textContent = '剩 18 秒以上 ★★★ · 剩 8 秒以上 ★★';
  } else {
    $('#inGoal').textContent = `${d.dur} 秒内得到 ${d.targets[0]} 分`;
    $('#inStars').textContent = `★ ${d.targets[0]}   ★★ ${d.targets[1]}   ★★★ ${d.targets[2]}` + (d.obj ? `，并且${d.obj.label}` : '');
  }
  let nt = null, note = '';
  if (d.w === 0 && d.n >= 2 && d.n <= 9) { nt = UNLOCK[d.n - 1]; note = '新朋友'; }
  else if (d.boss) { nt = 'boss'; note = '大王来了'; }
  else if (d.n === 1 && d.w > 0) { nt = null; note = d.w === 1 ? '沙滩上的洞更多了，地鼠也更快！' : '雪原有 16 个洞，最快最难！'; }
  const box = $('#inNew'); box.innerHTML = '';
  if (nt) {
    box.innerHTML = `<div class="newmole"><canvas></canvas><div><b>${note}：${TYPES[nt].name}</b>${TYPES[nt].tip}</div></div>`;
    moleIcon(box.querySelector('canvas'), nt);
  } else if (note) box.innerHTML = `<div class="newmole"><div>${note}</div></div>`;
  show('intro');
}

function startGame(mode) {
  G.mode = mode; G.paused = false; G.running = true; G.ending = 0; G.lastSec = 99;
  const defs = mode === 'level' ? [levelDef(G.L)] : mode === 'timed' ? [timedDef()] : [vsDef(), vsDef()];
  G.boards = defs.map((d, i) => makeBoard(d, i));
  if (mode === 'vs') { G.boards[0].opp = G.boards[1]; G.boards[1].opp = G.boards[0]; }
  layoutAll();
  G.count = 3.999; shoutAll('3', '#fff', 1.6); Snd.tick();
  show(null); setPlaying(true); Snd.duck(false); Snd.music(true); Snd.setBpm(126);
}
function pause() { if (!G.running || G.ending > 0 || G.mode === 'demo') return; G.paused = true; Snd.duck(true); show('pause'); }
function resume() { G.paused = false; Snd.duck(false); show(null); }

function showResult() {
  G.running = false; setPlaying(false); Snd.duck(true);
  const b = G.boards[0], d = b.def;
  const stars = $('#rsStars').children;
  [...stars].forEach(s => s.classList.remove('on'));
  $('#rsStars').style.display = d.mode === 'level' ? '' : 'none';
  $('#rsNext').style.display = 'none';
  $('#rsNote').innerHTML = '';
  $('#rsStats').textContent = d.mode === 'vs' ? '' : `最高连击 ${b.maxCombo} · 金地鼠 ${b.stats.gold} · 抓到小偷 ${b.stats.thief}` + (b.stats.friend ? ` · 误伤兔子 ${b.stats.friend}` : '');
  if (d.mode === 'level') {
    let n = 0, pass;
    if (d.boss) { pass = G.bossWin; n = pass ? (b.time >= 18 ? 3 : b.time >= 8 ? 2 : 1) : 0; }
    else {
      pass = b.score >= d.targets[0]; n = d.targets.filter(t => b.score >= t).length;
      if (n === 3 && d.obj && !objMet(b, d.obj)) { n = 2; $('#rsNote').textContent = `差一点三星：要${d.obj.label}`; }
    }
    $('#rsTitle').textContent = pass ? (d.boss ? '打败大王啦！' : '过关啦！') : (d.boss ? '大王跑掉了…' : '差一点点！');
    $('#rsScore').textContent = b.score;
    if (pass) {
      const prev = save.stars[d.L] || 0; save.stars[d.L] = Math.max(prev, n); persist();
      if (d.L < 30) $('#rsNext').style.display = '';
      Snd.win();
    } else Snd.lose();
    [...stars].forEach((s, i) => setTimeout(() => { if (i < n) { s.classList.add('on'); Snd.coin(); } }, 350 + i * 320));
  } else if (d.mode === 'timed') {
    const rec = b.score > save.best60;
    if (rec) { save.best60 = b.score; persist(); $('#rsNote').innerHTML = '<div class="newrec">新纪录！</div>'; }
    $('#rsTitle').textContent = '60 秒挑战';
    $('#rsScore').textContent = b.score;
    Snd.win();
  } else {
    const [p1, p2] = G.boards;
    $('#rsTitle').textContent = p1.score === p2.score ? '平局！' : p1.score > p2.score ? '🔵 蓝队赢了！' : '🔴 红队赢了！';
    $('#rsScore').innerHTML = `<span style="color:#3a8fe6">${p1.score}</span> : <span style="color:#ff5a7a">${p2.score}</span>`;
    $('#rsStats').textContent = `蓝队最高连击 ${p1.maxCombo} · 红队最高连击 ${p2.maxCombo}`;
    Snd.win();
  }
  show('result');
}
function objMet(b, o) {
  return o.k === 'nofriend' ? b.stats.friend === 0 : o.k === 'nobomb' ? b.stats.bomb === 0 : o.k === 'combo' ? b.maxCombo >= o.v : o.k === 'gold' ? b.stats.gold >= o.v : o.k === 'thief' ? b.stats.thief >= o.v : true;
}

function renderGuide() {
  const order = ['normal', 'gold', 'helmet', 'thief', 'ice', 'thunder', 'clock', 'gift', 'boss', 'bunny', 'bomb'];
  const g = $('#guide'); g.innerHTML = order.map(t => `<div><canvas data-t="${t}"></canvas><span><b>${TYPES[t].name}${TYPES[t].pts ? ` · ${t === 'thief' ? '15/60' : TYPES[t].pts} 分` : ''}</b>${TYPES[t].tip}</span></div>`).join('');
  g.querySelectorAll('canvas').forEach(c => moleIcon(c, c.dataset.t));
}

function syncTogs() { document.querySelectorAll('[data-tog]').forEach(b => b.classList.toggle('off', !save[b.dataset.tog])); }
document.querySelectorAll('[data-tog]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.tog; save[k] = !save[k]; persist(); syncTogs(); Snd.unlock(); Snd.apply(); }));

$('#bLevels').onclick = () => { renderLevels(); show('levels'); };
$('#bTimed').onclick = () => startGame('timed');
$('#bVs').onclick = () => startGame('vs');
$('#bHelp').onclick = () => { renderGuide(); show('help'); };
$('#hpBack').onclick = () => { save.seenHelp = true; persist(); show('title'); };
$('#lvBack').onclick = () => show('title');
$('#inBack').onclick = () => { renderLevels(); show('levels'); };
$('#inGo').onclick = () => startGame('level');
$('#pauseBtn').onclick = pause;
$('#psGo').onclick = resume;
$('#psRetry').onclick = () => { G.mode === 'level' ? startGame('level') : startGame(G.mode); };
$('#psHome').onclick = goTitle;
$('#rsHome').onclick = goTitle;
$('#rsRetry').onclick = () => G.mode === 'level' ? showIntro(G.L) : startGame(G.mode);
$('#rsNext').onclick = () => { G.L = Math.min(30, G.L + 1); save.world = Math.floor((G.L - 1) / 10); persist(); showIntro(G.L); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p') { if (G.paused) resume(); else pause(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); Snd.suspend(); } else Snd.resume(); });
window.addEventListener('resize', resize);

$('#ver').textContent = VERSION;
syncTogs();
resize();
goTitle();
requestAnimationFrame(ts => { last = ts; loop(ts); });
window.MC = { G, levelDef, startGame, showIntro, hitMole, pickHole, save, step, whack, showResult };
</script>
</body>
</html>
